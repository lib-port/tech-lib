apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  namespace: lib-port
spec:
  # The HPA manages replicas after the initial deployment.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: guestbook
          image: localhost/lib-port/guestbook:v1
          # Load this image into kind first; no external registry is required.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: REDIS_ADDR
              value: redis:6379
            - name: ENABLE_LOAD_GENERATOR
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: guestbook
  namespace: lib-port
spec:
  selector:
    app: guestbook
  ports:
    - port: 3000
      targetPort: http

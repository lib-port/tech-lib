<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guestbook - {{.Version}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">A PLACE TO SAY HELLO</p>
        <h1>Guestbook - {{.Version}}</h1>
        <p>Leave a note, share a thought, or just say hello.</p>
      </header>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Leave a message</h2>
        <form id="guestbook-form">
          <label for="message">Your message</label>
          <textarea id="message" name="message" rows="3" required aria-describedby="message-help"></textarea>
          <div class="form-footer">
            <span id="message-help">Up to 280 characters.</span>
            <button type="submit" id="submit-button">Sign guestbook</button>
          </div>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="messages" aria-labelledby="entries-title">
        <div class="section-heading">
          <h2 id="entries-title">Messages <span id="count">0</span></h2>
          <button type="button" class="secondary" id="refresh-button">Refresh</button>
        </div>
        <p id="load-status" role="status" aria-live="polite"></p>
        <p id="empty-state">Loading messages...</p>
        <ul id="entries"></ul>
      </section>
      <footer>Made for lib-port</footer>
    </main>
  </body>
</html>
